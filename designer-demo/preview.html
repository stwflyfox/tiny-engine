<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/public/fonts/noto-sans-sc/chinese-simplified-400.css">
  <link rel="stylesheet" href="/public/fonts/noto-sans-sc/chinese-simplified-700.css">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Core Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 14px;
      scroll-behavior: smooth;
    }


    /* 全局字体设置 */
    body {
      font-family: 'Noto Serif SC', sans-serif;
      font-weight: 400;
      /* 必须显式指定字重数字 */
      color: #2c3e50;
    }

    /* 标题样式 */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-weight: 700;
      line-height: 1.3;
      margin: 1.8rem 0 1rem;
      color: #1a1a1a;
    }

    h1 {
      font-size: 2.8rem;
    }

    h2 {
      font-size: 2.2rem;
    }

    h3 {
      font-size: 1.8rem;
    }

    h4 {
      font-size: 1.5rem;
    }

    h5 {
      font-size: 1.25rem;
    }

    h6 {
      font-size: 1.1rem;
    }

    /* 段落样式 */
    p {
      margin-bottom: 1.5rem;
      font-size: 1.15rem;
      text-align: justify;
      hyphens: auto;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/preview.js"></script>
</body>

</html>
